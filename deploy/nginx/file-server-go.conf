# Included in the 443 server block of /etc/nginx/sites-available/tipitaka.lk.conf, next to file-server-prod.conf:
#     include /home/janaka/www/file_server/nginx/file-server-go.conf;
# Static files; file-server-prod.conf has /library and /cloud. File bytes never come through the droplet:
# they are served by Cloudflare (library.tipitaka.lk Worker, cdn.tipitaka.lk public bucket). Each path needs
# its own block, otherwise the catch-all "location /" sends it to the main site (8400).

# built assets and fonts straight from disk (gzip is on, but only for text/html by default)
location /fs-assets/ {
    alias /home/janaka/www/file_server/dist/fs-assets/;
    expires max;
    add_header Cache-Control "public, immutable";
    gzip_types text/css application/javascript;
}
location /fs-static/ {
    alias /home/janaka/www/file_server/dist/fs-static/;
    expires 30d;
}
