# Included in the 443 server block of /etc/nginx/sites-available/tipitaka.lk.conf, next to file-server.conf:
#     include /home/janaka/file-server-v2/deploy/nginx/file-server-prod.conf;

rewrite ^/library/674$ /library/674/download; # remove after fixing the android app

location /library {
    deny 157.90.182.25; # blexbot
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /cloud {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
