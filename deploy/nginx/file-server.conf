# Included in the 443 server block of /etc/nginx/sites-available/tipitaka.lk.conf:
#     include /home/janaka/file-server-v2/deploy/nginx/file-server.conf;
# Static files and the droplet download proxy; file-server-prod.conf has /library and /cloud. Each path needs
# its own block, otherwise the catch-all "location /" sends it to the main site (8400).

# built assets and fonts straight from disk (gzip is on, but only for text/html by default)
location /fs-assets/ {
    alias /home/janaka/file-server-v2/dist/client/fs-assets/;
    expires max;
    add_header Cache-Control "public, immutable";
    gzip_types text/css application/javascript;
}
location /fs-static/ {
    alias /home/janaka/file-server-v2/dist/client/fs-static/;
    expires 30d;
}

# Optional droplet download share (README). Links stay SigV2-signed; nginx forwards the raw path + query
# to Spaces over the VPC (Spaces SGP1 -> Droplet SGP1 is free). Unused until DROPLET_SHARE is set.
location /fs-dl/ {
    resolver 10.130.255.254 valid=300s ipv6=off;   # VPC-local DNS (default-sgp1): private Spaces route
    # Named capture, not $1: nginx re-escapes numbered captures when the URI has %-escapes, which turned
    # %E0 into %25E0 and ? into %3F, so Spaces got a different key (InvalidObjectName) for every download.
    if ($request_uri !~ "^/fs-dl(?<fs_upstream>/[^?]+\?.+)$") { return 404; }
    proxy_pass https://tipitaka.sgp1.digitaloceanspaces.com$fs_upstream;
    proxy_set_header Host tipitaka.sgp1.digitaloceanspaces.com;
    proxy_ssl_server_name on;
    proxy_ssl_name tipitaka.sgp1.digitaloceanspaces.com;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_buffering off;    # stream straight through: no disk, no memory build-up
    proxy_read_timeout 300s;
}
